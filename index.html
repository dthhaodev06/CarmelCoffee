<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carmel Coffee - Đăng Nhập</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #cbb269;
      --primary-hover: #b89d52;
      --bg-color: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --white: #ffffff;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Khung card tổng thể */
    .login-container {
      background: var(--white);
      width: 100%;
      max-width: 960px;
      min-height: 580px;
      border-radius: var(--radius);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      display: flex;
      overflow: hidden;
    }

    /* --- CỘT TRÁI: BANNER THƯƠNG HIỆU DOANH NGHIỆP --- */
    .brand-side {
      flex: 1;
      background: #3a251a url('https://lh3.googleusercontent.com/gps-cs-s/ANWiy9RP8iZeoponw_5grT8NaZkV-F6hwqcW7epqx6Mtr34dSSI3dvlQzCWFBSvrpV3I_bOwZTd9vN4NpYT9L6B_sXunJRyaTkTQYgbSw5P5k6mzf5oT-8lI9WcnvRgWf8zi2KlMb6SNcZoHCUWJ=s1360-w1360-h1020') center center / contain no-repeat;
      color: var(--white);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.15); 
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-logo .logo-icon {
      background: rgba(255, 255, 255, 0.2);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-content h2 {
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .brand-content p {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .brand-footer {
      font-size: 13px;
      color: #94a3b8;
    }

    /* --- CỘT PHẢI: FORM ĐĂNG NHẬP --- */
    .form-side {
      flex: 1.2;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      background: var(--white);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(203, 178, 105, 0.2);
    }

    /* Hàng ghi nhớ đăng nhập & quên mật khẩu */
    .form-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .forgot-pass {
      color: #b45309;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    /* Nút đăng nhập */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(203, 178, 105, 0.35);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(203, 178, 105, 0.45);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    /* Responsive cho điện thoại */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .login-container {
        flex-direction: column;
        max-width: 440px;
        min-height: auto;
      }
      .brand-side {
        display: none;
      }
      .form-side {
        padding: 36px 22px;
      }
      .form-header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- CỘT TRÁI: THƯƠNG HIỆU & GIỚI THIỆU -->
    <div class="brand-side">
      <div class="brand-logo">
      </div>

      <div class="brand-content">
        <h2></h2>
        <p></p>
      </div>

      <div class="brand-footer">
      </div>
    </div>

    <!-- CỘT PHẢI: FORM ĐĂNG NHẬP -->
    <div class="form-side">
      <div class="form-header">
        <h1>CARMEL COFFEE</h1>
        <p>Đăng nhập để vào hệ thống quản lý ca làm việc</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <!-- Ô chọn vai trò -->
        <div class="form-group">
          <label for="role">Vai trò</label>
          <div class="input-wrapper">
            <select id="role">
              <option value="employee">Nhân viên (Staff)</option>
              <option value="manager">Quản lý cửa hàng (Manager)</option>
            </select>
          </div>
        </div>

        <!-- Ô tài khoản / tên -->
        <div class="form-group">
          <label for="username">Tên nhân viên hoặc Email</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="Nhập tên của bạn" required>
          </div>
        </div>

        <!-- Ô mật khẩu -->
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>
          </div>
        </div>

        <!-- Nhớ tài khoản & Quên mật khẩu -->
        <div class="form-meta">
          <label class="remember-me">
            <input type="checkbox" checked> Ghi nhớ phiên đăng nhập
          </label>
          <a href="#" class="forgot-pass" onclick="alert('Vui lòng liên hệ Quản lý cửa hàng để khôi phục mật khẩu!')">Quên mật khẩu?</a>
        </div>

        <!-- Nút bấm -->
        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>
    </div>

  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const rawInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const roleInput = document.getElementById('role').value;

      if (!rawInput) {
        alert('Vui lòng nhập tên tài khoản hoặc email!');
        return;
      }

      let staffName = rawInput.includes('@') ? rawInput.split('@')[0] : rawInput;
      staffName = staffName.charAt(0).toUpperCase() + staffName.slice(1);

      try {
        // Gửi thông tin đăng nhập lên server Node.js
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: staffName,
            pass: passInput,
            role: roleInput
          })
        });

        const result = await res.json();

        if (!result.success) {
          alert('❌ ' + result.message);
          return;
        }

        // ========================================================
        // KIỂM TRA CHẶN: VAI TRÒ CHỌN PHẢI TRÙNG VỚI VAI TRÒ THỰC TẾ
        // ========================================================
        if (result.user && result.user.role !== roleInput) {
          const selectedText = (roleInput === 'manager') ? 'Quản lý (Manager)' : 'Nhân viên (Staff)';
          const actualText = (result.user.role === 'manager') ? 'Quản lý' : 'Nhân viên';
          
          alert(`Đăng nhập không thành công`);
          return; // Chặn lại, không cho phép lưu phiên hay chuyển trang
        }

        // Lưu thông tin phiên đăng nhập hợp lệ
        localStorage.setItem('currentUser', JSON.stringify(result.user));

        // Tải toàn bộ dữ liệu mới nhất từ server về lưu vào localStorage trước khi mở trang
        try {
          const syncRes = await fetch('/api/data');
          if (syncRes.ok) {
            const data = await syncRes.json();
            const keys = [
              'carmel_user_accounts',
              'carmel_full_users',
              'carmel_staff_rates',
              'all_staff_registrations',
              'carmel_registrations_by_week',
              'carmel_master_roster',
              'carmel_rosters_by_week',
              'carmel_shift_requests',
              'carmel_inventory',
              'carmel_revenue_records',
              'carmel_expense_records'
            ];
            keys.forEach(k => {
              if (data[k] !== undefined) {
                localStorage.setItem(k, JSON.stringify(data[k]));
              }
            });
          }
        } catch (syncErr) {
          console.warn('Lỗi tiền đồng bộ dữ liệu:', syncErr);
        }

        // Chuyển sang màn hình quản lý
        window.location.href = "dashboard.html";
      } catch (err) {
        alert('⚠️ Không thể kết nối đến máy chủ! Hãy kiểm tra cửa sổ Terminal xem "node server.js" có đang chạy không.');
      }
    }
  </script>
</body>
</html>
