<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#241811">  <title>Carmel Coffee - Đăng Nhập</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logocarmel.jpg">
  <link rel="icon" type="image/jpeg" href="/logocarmel.jpg">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #cbb269;
      --primary-hover: #b89d52;
      --bg-color: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --white: #ffffff;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Khung card tổng thể */
    .login-container {
      background: var(--white);
      width: 100%;
      max-width: 960px;
      min-height: 580px;
      border-radius: var(--radius);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      display: flex;
      overflow: hidden;
    }

    /* --- CỘT TRÁI: BANNER THƯƠNG HIỆU DOANH NGHIỆP (DESKTOP) --- */
    .brand-side {
      flex: 1;
      background-color: #3a251a;
      background-image: url('carmelcoffee.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.15); 
    }

    /* --- CỘT PHẢI: FORM ĐĂNG NHẬP --- */
    .form-side {
      flex: 1.2;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Logo tròn hiển thị trên mobile */
    .mobile-brand-logo {
      display: none;
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14.5px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      background: var(--white);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(203, 178, 105, 0.2);
    }

    /* Hàng ghi nhớ đăng nhập & quên mật khẩu */
    .form-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .forgot-pass {
      color: #b45309;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    /* Nút đăng nhập */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #cbb269 0%, #b89d52 100%);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(203, 178, 105, 0.4);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #b89d52 0%, #a58b42 100%);
      box-shadow: 0 8px 20px rgba(203, 178, 105, 0.5);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    /* --- DECOR GIAO DIỆN ĐIỆN THOẠI (MOBILE) --- */
    @media (max-width: 768px) {
      body {
        background: linear-gradient(180deg, #463222 0%, #3a251a 42%, #f8f5f0 42%, #f8f5f0 100%);
        padding: 24px 16px;
        align-items: center;
      }

      .login-container {
        flex-direction: column;
        max-width: 420px;
        min-height: auto;
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(58, 37, 26, 0.22);
        border: 1px solid rgba(203, 178, 105, 0.25);
      }

      .brand-side {
        display: none;
      }

      .form-side {
        padding: 36px 24px 32px;
      }

      .mobile-brand-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 14px;
      }

      .mobile-brand-logo img {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid #cbb269;
        box-shadow: 0 8px 20px rgba(70, 50, 34, 0.28);
      }

      .form-header {
        text-align: center;
        margin-bottom: 24px;
      }

      .form-header h1 {
        font-size: 23px;
        color: #3a251a;
        letter-spacing: 0.5px;
      }

      .form-header p {
        font-size: 13.5px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- CỘT TRÁI: THƯƠNG HIỆU & GIỚI THIỆU -->
    <div class="brand-side">
      <div class="brand-logo"></div>
      <div class="brand-content">
        <h2></h2>
        <p></p>
      </div>
      <div class="brand-footer"></div>
    </div>

    <!-- CỘT PHẢI: FORM ĐĂNG NHẬP -->
    <div class="form-side">
      <!-- Logo tròn hiển thị riêng trên điện thoại -->
      <div class="mobile-brand-logo">
        <img src="/logocarmel.jpg" alt="Carmel Coffee Logo">
      </div>

      <div class="form-header">
        <h1>CARMEL COFFEE</h1>
        <p>Đăng nhập để vào hệ thống quản lý ca làm việc</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <!-- Ô chọn vai trò -->
        <div class="form-group">
          <label for="role">Vai trò</label>
          <div class="input-wrapper">
            <select id="role">
              <option value="employee">Nhân viên (Staff)</option>
              <option value="manager">Quản lý cửa hàng (Manager)</option>
            </select>
          </div>
        </div>

        <!-- Ô tài khoản / tên -->
        <div class="form-group">
          <label for="username">Tên nhân viên hoặc Email</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="Nhập tên của bạn" required>
          </div>
        </div>

        <!-- Ô mật khẩu -->
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>
          </div>
        </div>

        <!-- Nhớ tài khoản & Quên mật khẩu -->
        <div class="form-meta">
          <label class="remember-me">
            <input type="checkbox" checked> Ghi nhớ phiên đăng nhập
          </label>
          <a href="#" class="forgot-pass" onclick="alert('Vui lòng liên hệ Admin để khôi phục mật khẩu!')">Quên mật khẩu?</a>
        </div>

        <!-- Nút bấm -->
        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>
    </div>

  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const rawInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const roleInput = document.getElementById('role').value;

      if (!rawInput) {
        alert('Vui lòng nhập tên tài khoản hoặc email!');
        return;
      }

      let staffName = rawInput.includes('@') ? rawInput.split('@')[0] : rawInput;
      staffName = staffName.charAt(0).toUpperCase() + staffName.slice(1);

      try {
        // Gửi thông tin đăng nhập lên server Node.js
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: staffName,
            pass: passInput,
            role: roleInput
          })
        });

        const result = await res.json();

        if (!result.success) {
          alert('❌ ' + result.message);
          return;
        }

        // KIỂM TRA CHẶN: VAI TRÒ CHỌN PHẢI TRÙNG VỚI VAI TRÒ THỰC TẾ
        if (result.user && result.user.role !== roleInput) {
          alert(`Đăng nhập không thành công`);
          return;
        }

        // Lưu thông tin phiên đăng nhập hợp lệ
        localStorage.setItem('currentUser', JSON.stringify(result.user));

        // Tải toàn bộ dữ liệu mới nhất từ server về lưu vào localStorage trước khi mở trang
        try {
          const syncRes = await fetch('/api/data');
          if (syncRes.ok) {
            const data = await syncRes.json();
            const keys = [
              'carmel_user_accounts',
              'carmel_full_users',
              'carmel_staff_rates',
              'all_staff_registrations',
              'carmel_registrations_by_week',
              'carmel_master_roster',
              'carmel_rosters_by_week',
              'carmel_shift_requests',
              'carmel_inventory',
              'carmel_revenue_records',
              'carmel_expense_records'
            ];
            keys.forEach(k => {
              if (data[k] !== undefined) {
                localStorage.setItem(k, JSON.stringify(data[k]));
              }
            });
          }
        } catch (syncErr) {
          console.warn('Lỗi tiền đồng bộ dữ liệu:', syncErr);
        }

        // Chuyển sang màn hình quản lý
        window.location.href = "dashboard.html";
      } catch (err) {
        alert('⚠️ Không thể kết nối đến máy chủ! Hãy kiểm tra cửa sổ Terminal xem "node server.js" có đang chạy không.');
      }
    }
  </script>
</body>
</html>
